name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run sync-version -- --check

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Fail fast on formatting before paying for apt + frontend build + cargo.
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'linux'

      # Build the frontend first: tauri::generate_context!() in
      # src-tauri/src/main.rs requires ../dist to exist at compile time.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # Create the release once, before the matrix builds. tauri-action creates the
  # release itself when it cannot find one, so parallel matrix jobs race: the
  # loser gets "Validation Failed: already_exists" and its assets are never
  # uploaded (that is how v1.3.0 lost the macOS DMG). With the release already
  # in place every job finds it and only uploads assets.
  prepare-release:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Git Light $TAG" \
            --notes "See the assets to download this version and install." \
            --verify-tag

  build:
    needs: [verify, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils zsync

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'release-${{ matrix.platform }}'

      - run: npm ci --no-audit --no-fund

      # linuxdeploy's AppImage plugin reads this and embeds the update string in
      # the AppImage. `latest` (not the version tag) keeps update checks pointed
      # at the newest stable release.
      - name: AppImage update information
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "LDAI_UPDATE_INFORMATION=gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|Git.Light_*_amd64.AppImage.zsync" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Git Light ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # appimagetool only writes the .zsync when it can find zsyncmake itself,
      # which is not reliable inside Tauri's linuxdeploy sandbox: the v1.2.0
      # build embedded the update information but produced no .zsync. Generate
      # it explicitly so the asset the update string points at always exists.
      - name: Generate AppImage zsync
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*_amd64.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "expected exactly one amd64 AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi
          # GitHub turns spaces into dots in release asset names, so build the
          # zsync from a copy named exactly like the published asset. Keeping
          # the header filename and the download URL in sync matters for
          # AppImageUpdate.
          name="$(basename "${appimages[0]}" | tr ' ' '.')"
          mkdir -p "$RUNNER_TEMP/zsync"
          cp "${appimages[0]}" "$RUNNER_TEMP/zsync/$name"
          zsyncmake -u "$name" -o "$RUNNER_TEMP/zsync/$name.zsync" "$RUNNER_TEMP/zsync/$name"

      # tauri-action uploads only its own artifact list, which has no .zsync.
      - name: Upload AppImage zsync
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/zsync/*.AppImage.zsync \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Replace the tauri-action placeholder body with a real changelog. The in-app
  # "What's new" dialog renders this release body, so keep it meaningful.
  release-notes:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Publish release notes from commit history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            heading="Changes since ${previous}"
            range="${previous}..${TAG}"
          else
            heading="Initial release"
            range="${TAG}"
          fi
          {
            echo "$heading"
            echo
            git log "$range" --no-merges --invert-grep --grep='^Release v' --pretty=format:'- %s'
            echo
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
            fi
          } > release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

  # Publish CHECKSUMS.txt with sha256 for every asset. scripts/install.sh and the
  # in-app updater verify downloads against it.
  checksums:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload CHECKSUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir download && cd download
          gh release download "$TAG" --repo ftuyama/git-light --clobber
          sha256sum * > CHECKSUMS.txt
          rm -- *.dmg *.tar.gz *.exe *.msi *.AppImage *.deb *.rpm
          gh release upload "$TAG" CHECKSUMS.txt --repo ftuyama/git-light --clobber
